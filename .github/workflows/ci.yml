name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify production environment shape
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-placeholder
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
          CRON_SECRET: ci-cron-secret-placeholder-32-characters-long
          PAYMENT_PROVIDER: taypi
          TAYPI_PUBLIC_KEY: taypi_pk_live_ci_placeholder
          TAYPI_SECRET_KEY: taypi_sk_live_ci_placeholder
          TAYPI_WEBHOOK_SECRET: ci-taypi-webhook-placeholder
          TAYPI_API_URL: https://app.taypi.pe
          TAYPI_SANDBOX: 'false'
          VITE_DEMO_MODE: 'false'
        run: npm run verify:production
