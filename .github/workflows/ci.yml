name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify production environment shape
        env:
          VITE_FIREBASE_API_KEY: ci-firebase-api-key
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-firebase
          VITE_FIREBASE_MESSAGING_SENDER_ID: ci-sender
          VITE_FIREBASE_APP_ID: ci-app
          DATABASE_URL: postgres://ci:ci@example.com/ci
          FIREBASE_PROJECT_ID: ci-firebase
          FIREBASE_CLIENT_EMAIL: ci@example.com
          FIREBASE_PRIVATE_KEY: ci-private-key
          CRON_SECRET: ci-cron-secret-placeholder-32-characters-long
          PAYMENT_PROVIDER: taypi
          TAYPI_PUBLIC_KEY: ci-live-public-placeholder
          TAYPI_SECRET_KEY: ci-live-secret-placeholder
          TAYPI_WEBHOOK_SECRET: ci-taypi-webhook-placeholder
          TAYPI_API_URL: https://app.taypi.pe
          TAYPI_SANDBOX: 'false'
          VITE_DEMO_MODE: 'false'
        run: |
          export TAYPI_PUBLIC_KEY="taypi_pk_live_$(printf 'a%.0s' {1..32})"
          export TAYPI_SECRET_KEY="taypi_sk_live_$(printf 'b%.0s' {1..64})"
          npm run verify:production
